name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME is: ${JAVA_HOME}"
          
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not defined."
            exit 1
          fi

          JAVA_VER_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "${JAVA_VER_OUTPUT}" | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')

          echo "Detected Java Major Version: ${JAVA_MAJOR}"

          if [ -z "${JAVA_MAJOR}" ] || ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect active Java major version."
            exit 1
          fi

          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Active Java version (${JAVA_MAJOR}) is lower than 17."
            exit 1
          fi

          echo "Java environment verified successfully (version >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create or find ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore confirmed."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected APK not found at: ${EXPECTED_APK}"
            echo "Searching within app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: APK file exists but is empty: ${EXPECTED_APK}"
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: ${EXPECTED_APK}"; exit 1 ;;
          esac

          echo "Verified debug APK successfully: ${EXPECTED_APK} ($(stat -c%s "${EXPECTED_APK}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "${TEMP_RELEASE_DIR}"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "${RELEASE_ASSET_PATH}"

          if [ ! -f "${RELEASE_ASSET_PATH}" ] || [ ! -s "${RELEASE_ASSET_PATH}" ]; then
            echo "ERROR: Failed to prepare release asset at ${RELEASE_ASSET_PATH}"
            exit 1
          fi

          echo "Release asset prepared: ${RELEASE_ASSET_PATH}"
          echo "asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "ERROR: Asset file missing or empty: ${ASSET_PATH}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### 📱 Debug APK Build #${GITHUB_RUN_NUMBER}

          - **Build System**: GitHub Actions
          - **Workflow Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: \`${GITHUB_SHA}\`
          - **Release Asset**: \`${ASSET_NAME}\`

          > **Note**: This is an automatically generated debug APK intended for testing. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )

          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "============================================================"
            echo "✓ GitHub Release Published Successfully!"
            echo "============================================================"
            
            RELEASE_URL=""
            if command -v gh &> /dev/null; then
              gh release view "${RELEASE_TAG}" || true
              RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            else
              RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            fi

            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "Asset Filename: ${ASSET_NAME}"

            echo "### 🚀 Debug APK Released Successfully!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Direct Release Page**: [${RELEASE_TITLE}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Download**: \`${ASSET_NAME}\` (Available under the release **Assets** section for direct phone download)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact**: The standard \`app-debug-apk\` GitHub Actions artifact is also retained on this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "============================================================"
            echo "⚠ Notice: GitHub Release publishing could not be completed."
            echo "============================================================"
            echo "The debug APK was built and verified successfully."
            echo "The GitHub Actions artifact 'app-debug-apk' is uploaded and available."

            echo "### ⚠ Debug APK Build Succeeded (Release Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Build Status**: Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact**: \`app-debug-apk\` is available for download on this run summary page." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Publishing Note**: Automated GitHub Release publishing encountered an issue or requires workflow permissions." >> "$GITHUB_STEP_SUMMARY"
          fi
